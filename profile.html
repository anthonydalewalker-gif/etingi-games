<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0d1c"><link rel="icon" href="icons/chess-legends.png"><link rel="stylesheet" href="style.css"><script src="shared/etingi-config.js"></script><script src="shared/etingi-auth.js"></script><title>My profile – Etingi Games</title><meta name="robots" content="noindex"></head><body><script src="site.js"></script>
<main class="prof" id="p"><p class="muted">Loading…</p></main>
<script>
var P=document.getElementById('p');function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return'&#'+c.charCodeAt(0)+';'})}
function draw(u){if(!u){P.innerHTML='<div class="box" style="text-align:center"><h1>👤 Your profile</h1><p class="muted">Log in to see your Etingi profile and game stats.</p><div class="btns" style="justify-content:center"><a class="btn p" href="account.html?next=profile.html">Log in</a><a class="btn" href="account.html?mode=signup">Create account</a></div></div>';return}
 var p=u.profile||{},name=p.username||u.email;
 P.innerHTML='<div class="head"><div class="av">'+(p.avatar_url?'<img src="'+e(p.avatar_url)+'" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;border-radius:50%;object-fit:cover" onerror="this.remove()">':e(name.slice(0,1).toUpperCase()))+'</div><div><h1>'+e(p.display_name||name)+'</h1>'+(p.display_name?'<div class="muted">@'+e(p.username)+'</div>':'')+'<div class="muted">'+e(u.email)+'</div><div class="muted">Member since '+new Date(p.created_at||u.created_at).toLocaleDateString()+'</div></div></div>'
 +(p.elo!=null?'<h2 class="sec">♟️ Chess Legends</h2><div class="kv"><div><b>'+e(p.elo)+'</b><span class="muted">Rating</span></div><div><b>'+e(p.wins)+'</b><span class="muted">Wins</span></div><div><b>'+e(p.losses)+'</b><span class="muted">Losses</span></div><div><b>'+e(p.draws)+'</b><span class="muted">Draws</span></div></div>':'')
 +'<form class="box ea-form" id="ed" novalidate><h3 style="margin:0">Edit profile</h3>'
 +'<label>Display name <small>(optional, up to 40 characters)</small><input name="dn" maxlength="40" value="'+e(p.display_name)+'"></label>'
 +'<label>Avatar image URL <small>(optional, must start with https://)</small><input name="av" type="url" maxlength="500" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://…" value="'+e(p.avatar_url)+'"></label>'
 +'<label>Username <small>(3–16 letters, numbers or _; shown in every game)</small><input name="un" maxlength="16" autocapitalize="off" spellcheck="false" value="'+e(p.username)+'"></label>'
 +'<div class="ea-msg" id="edm" role="status"></div><button class="ea-btn ea-primary" type="submit">💾 Save changes</button></form>'
+'<div class="box"><h3 style="margin-top:0">Security</h3><div class="btns"><a class="btn" href="account.html?mode=forgot">🔑 Reset password</a><button class="btn" id="out">🚪 Log out</button></div></div>';
 document.getElementById('out').onclick=function(){EtingiAuth.signOut()};document.getElementById('ed').onsubmit=save}
function errMsg(x){var m=(x&&(x.message||x.details||x.hint||x.code))||String(x);
 if(/taken|exists|unique|23505|duplicate/i.test(m))return 'That username is taken. Try another.';
 if(/invalid|23514|check|format/i.test(m))return 'That value isn\'t allowed: '+m;
 if(/jwt|session|not.?auth/i.test(m))return 'Your session expired. Please log in again.';
 if(/fetch|network/i.test(m))return 'Couldn\'t reach the server. Check your connection.';
 if(/permission|denied|42501|policy/i.test(m))return 'You can only edit your own profile.';
 return 'Could not save ('+m.slice(0,100)+').'}
async function save(ev){ev.preventDefault();var f=ev.target,msg=function(t){document.getElementById('edm').textContent=t},btn=f.querySelector('[type=submit]');
 var dn=f.dn.value.trim(),av=f.av.value.trim(),un=f.un.value.trim(),p=EtingiAuth.profile||{};
 if(dn.length>40)return msg('Display name can be at most 40 characters.');
 if(av&&(!/^https:\/\/[^\s]+$/i.test(av)||av.length>500))return msg('Avatar URL must start with https:// and be at most 500 characters.');
 if(!/^[A-Za-z0-9_]{3,16}$/.test(un))return msg('Username must be 3–16 letters, numbers or _.');
 btn.disabled=true;msg('Saving…');var sb=EtingiAuth.client;
 try{
  if(dn!==(p.display_name||'')||av!==(p.avatar_url||'')){var r=await sb.from('profiles').update({display_name:dn||null,avatar_url:av||null}).eq('id',EtingiAuth.user.id).select('id');if(r.error)throw r.error;if(!r.data||!r.data.length)throw {message:'permission denied'};}
  if(un!==p.username){var r2=await sb.rpc('change_username',{new_username:un});if(r2.error)throw r2.error;}
  await EtingiAuth.reloadProfile();EtingiAuth.toast('✅ Profile saved');
 }catch(x){btn.disabled=false;msg(errMsg(x))}}
EtingiAuth.init().then(function(){EtingiAuth.onChange(draw)}).catch(function(x){P.innerHTML='<p>Could not reach the account server.</p>'});
</script></body></html>
