// ===== Chess Legends engine (0x88, alpha-beta + quiescence) =====
var N_=[33,31,18,14,-33,-31,-18,-14],K_=[1,-1,16,-16,15,17,-15,-17],B_=[15,17,-15,-17],R_=[1,-1,16,-16];
var bd=new Int8Array(128),side=0,castle=0,ep=-1,kings=[0,0],stack=[],nodes=0,stopT=0,aborted=false,canAbort=false,killers=[],W=null;

var CM=new Array(128).fill(15);CM[0]=13;CM[4]=12;CM[7]=14;CM[112]=7;CM[116]=3;CM[119]=11;

function mergeStatic(root){const groups=[];root.traverse(o=>{if(o.isGroup||o===root)groups.push(o);});

   const mg=mergeGeometries(geos,false);if(!mg)continue;const mm=new THREE.Mesh(mg,list[0].material);mm.castShadow=true;mm.receiveShadow=true;list.forEach(m=>g.remove(m));g.add(mm);}}}

function allMate(n){const rs=game.moves();if(!rs.length)return false;for(const r of rs){game.move(r);const ok=canMate(n);game.undo();if(!ok)return false;}return true;}

async function olPoll(){if(!OL.gid)return;const gid=OL.gid;try{const g=await olFetch(gid);if(gid===OL.gid)olApplyRow(g);}catch(e){}}
async function olBeat(){if(!OL.gid)return;try{const t0=Date.now();const {data,error}=await OL.sb.rpc('heartbeat',{p_game:OL.gid});if(!error&&data)OL.off=Date.parse(data)-(t0+Date.now())/2;}catch(e){}}
const olOnline=()=>session&&session.type==='online'&&OL.gid&&session.gid===OL.gid;
function olApplyRow(g){if(!olOnline()||!g||g.id!==OL.gid)return;
 if(OL.row&&g.moves&&OL.row.moves&&g.moves.length<OL.row.moves.length&&OL.row.status==='active'&&g.status==='active')return; // stale
 OL.row=g;olDrawUI();olDrain();}
function olHardSync(){const g=OL.row;game.reset();sanList=[];fenList=[game.fen()];lastMove=null;
 for(const s of g.moves){let mv=null;try{mv=game.move(s);}catch(e){}if(!mv)break;sanList.push(mv.san);fenList.push(game.fen());lastMove=[mv.from,mv.to];}
 clearSel();if(view3d)buildPieces();else dirty3D=true;render();}
async function olDrain(){if(OL.draining||busy||OL.pending||!olOnline())return;OL.draining=true;
 try{for(let guard=0;guard<400&&olOnline()&&!OL.pending;guard++){const srv=OL.row.moves||[],n=sanList.length,k=Math.min(n,srv.length);
   const prefix=srv.slice(0,k).every((s,i)=>s===sanList[i]);
   if(prefix&&srv.length>n){OL.applying=true;const sid=session.id;const mv=await doMove(srv[n]);OL.applying=false;if(!session||session.id!==sid)return;if(!mv){olHardSync();break;}continue;}
   if(!prefix||(srv.length<n&&Date.now()-OL.postDoneAt>3000))olHardSync();
   break;}}
 finally{OL.draining=false;OL.applying=false;}
 if(olOnline()&&OL.row.status==='over'&&OL.row.moves.length===sanList.length&&!busy)olEnd(OL.row);}
async function onlineAfter(mv){sanList.push(mv.san);fenList.push(game.fen());render();
 if(mv.color!==session.me||OL.applying)return;
 const sid=session.id;OL.pending=true;let msg=null;
 try{
  const j=await olInvoke('move',{gameId:session.gid,ply:sanList.length-1,from:mv.from,to:mv.to,promotion:mv.promotion||null});if(!j.ok)msg=j.error||'Move rejected';}
 catch(e){msg='Connection problem';}
 OL.pending=false;OL.postDoneAt=msg?0:Date.now();if(!session||session.id!==sid)return;
 if(msg)toast('⚠️ '+msg+' — syncing with the server');await olPoll();if(msg&&olOnline())olHardSync();}
function olDrawUI(){const g=OL.row,me=session.me;let want='';
 if(g.status==='active'&&g.draw_offer&&g.draw_offer!==me)want='in';else if(g.status==='active'&&g.draw_offer===me)want='out';
 $('tDraw').textContent=want==='in'?'🤝 Accept draw':want==='out'?'🤝 Draw offered…':'🤝 Offer draw';$('tDraw').disabled=want==='out'||g.status!=='active';
 if(want===OL.banner)return;OL.banner=want;
 if(want==='in'){banner(`<b>🤝 ${escH(session.names[other(me)])} offers a draw.</b><div class="row"><button class="btn sm green" id="olDA">✔ Accept</button><button class="btn sm gray" id="olDD">✖ Decline</button></div>`);
  $('olDA').onclick=()=>olDraw('accept');$('olDD').onclick=()=>olDraw('decline');SFX.click();}
 else if($('banner').querySelector('#olDA')||$('banner').querySelector('#olRY'))$('banner').classList.add('hidden');}
async function olDraw(a){$('banner').classList.add('hidden');OL.banner='';try{const {error}=await OL.sb.rpc('draw_action',{p_game:OL.gid,p_action:a});if(error)throw error;if(a==='offer')toast('🤝 Draw offered');}catch(e){toast('⚠️ Couldn\'t send that');}olPoll();}
function olResignAsk(){if(!olOnline()||!gameActive)return;banner(`<b>🏳️ Resign this game?</b><div class="row"><button class="btn sm pink" id="olRY">Yes, resign</button><button class="btn sm gray" id="olRN">Keep playing</button></div>`);
 $('olRY').onclick=async()=>{$('banner').classList.add('hidden');try{await OL.sb.rpc('resign_game',{p_game:OL.gid});}catch(e){}olPoll();};$('olRN').onclick=()=>$('banner').classList.add('hidden');}
function olTick(){if(!olOnline())return;const g=OL.row;if(!g)return;const now=Date.now()+OL.off;
 const left={w:g.clock_w_ms,b:g.clock_b_ms};if(g.status==='active'&&g.moves.length>=1)left[g.turn]-=now-Date.parse(g.turn_started_at);
 clock={w:Math.max(0,left.w/1000),b:Math.max(0,left.b/1000),inc:0};
 for(const c of['w','b']){const el=$(c==='w'?'ckW':'ckB');el.textContent=fmt(clock[c]);el.classList.toggle('low',clock[c]<30);}
 if(g.status!=='active'){if(!busy&&!OL.draining&&OL.row.moves.length!==sanList.length)olDrain();return;}
 const opp=other(session.me),away=(now-Date.parse(g[opp==='w'?'white_seen':'black_seen']))/1000;
 if(away>20&&gameActive&&!busy)$('status').textContent=`⚠️ ${session.names[opp]} lost connection… win claimed in ${Math.max(0,Math.ceil(61-away))} s`;
 if((left[g.turn]<=0&&g.moves.length>=1)||away>61){if(Date.now()-OL.lastClaim>3000){OL.lastClaim=Date.now();OL.sb.rpc('claim_timeout',{p_game:OL.gid}).then(()=>olPoll(),()=>{});}}
 if(!busy&&!OL.draining&&!OL.pending&&g.moves.length!==sanList.length)olDrain();}
function olEnd(g){if(OL.ended===g.id)return;OL.ended=g.id;gameActive=false;clearSel();$('thinking').classList.add('hidden');
 const me=session.me,opp=other(me),won=g.result===me,draw=g.result==='draw';const d=g.rating_delta&&g.rating_delta[me]!=null?g.rating_delta[me]:0;const elo=session.elos[me]+d;
 const R={checkmate:'checkmate',resignation:won?session.names[opp]+' resigned':'resignation',timeout:won?session.names[opp]+'\'s flag fell':'time ran out',abandoned:won?session.names[opp]+' left the game':'you were away too long',agreement:'agreement',stalemate:'stalemate','insufficient material':'insufficient material',repetition:'threefold repetition','50-move rule':'50-move rule'};
 const reason=R[g.reason]||g.reason||'';const title=draw?'🤝 Draw':won?'🏆 Victory!':'💀 Defeat…';draw||won?SFX.win():SFX.lose();
 S.games++;if(won)ev('win');S.lastGame={startFen,sans:sanList.slice(),fens:fenList.slice(),result:g.result,reason:g.reason,date:Date.now(),label:'online'};save();
 $('status').textContent=title.replace(/^\S+ /,'')+' ('+reason+')';$('tDraw').classList.add('hidden');OL.timers.forEach(clearInterval);OL.timers=[];if(OL.chan){OL.sb.removeChannel(OL.chan).catch(()=>{});OL.chan=null;}
 render();for(const c of['w','b'])$(c==='w'?'ckW':'ckB').textContent=fmt(clock?clock[c]:0);
 $('overBox').innerHTML=`<h1>${title}</h1><p style="font-size:20px;font-weight:bold">by ${escH(reason)}</p><div style="font-size:18px">vs ${escH(session.names[opp])} (${session.elos[opp]})</div>
  <div style="font-size:20px;margin-top:6px">⭐ Rating: <b>${elo}</b> (${d>=0?'+':''}${d})</div>
  <div class="olrow" style="justify-content:center;margin-top:16px"><button class="btn green" id="oNew">🎲 Find new opponent</button><button class="btn alt" id="oRp">🎬 Replay</button><button class="btn pink" id="oSee">👁️ View board</button><button class="btn gray" id="oMenu">🏠 Menu</button></div>`;
 setTimeout(()=>{$('over').classList.remove('hidden');$('oNew').onclick=()=>{showMenu();olFind();};$('oRp').onclick=startReplay;$('oMenu').onclick=showMenu;$('oSee').onclick=()=>$('over').classList.add('hidden');},700);}
$('tDraw').onclick=()=>{if(!olOnline()||!gameActive)return;const g=OL.row;olDraw(g.draw_offer&&g.draw_offer!==session.me?'accept':'offer');};

// ================= HUD tools =================
$('tMenu').onclick=showMenu;

 showModal(`<h2>⚙️ Settings</h2><b>🎥 Cinematic level</b>${opts('cine',[['all','Every move'],['cap','Captures only'],['off','Off']],S.cine)}
 <b>🔊 Sound</b>${opts('snd',[['on','On'],['off','Muted']],S.sound?'on':'off')}

 <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="setSave">✔ Apply</button><button class="btn gray" id="setCam">🎯 Reset camera view</button></div>`);
 $('setSave').onclick=()=>{S.cine=optVal('cine');S.sound=optVal('snd')==='on';S.quality=optVal('ql');save();applyQuality();closeModal();render();toast('Settings saved');};
 $('setCam').onclick=()=>{closeModal();if(session&&!menuOpen&&!busy)moveCam(topPos(),topLook(),.7);};}
$('tSet').onclick=showSettings;
$('tView').onclick=()=>{view3d=!view3d;applyView();render();SFX.click();};
$('tCine').onclick=()=>{S.cine=({all:'cap',cap:'off',off:'all'})[S.cine]||'all';save();render();toast('🎥 Cinematic: '+({all:'Every move',cap:'Captures only',off:'Off'})[S.cine]);};
$('tSound').onclick=()=>{S.sound=!S.sound;save();render();};
$('tUni').onclick=()=>{const ks=Object.keys(UNIVERSES);S.sel.universe=ks[(ks.indexOf(S.sel.universe)+1)%ks.length];save();applyUniverse();toast(UNIVERSES[S.sel.universe].icon+' '+UNIVERSES[S.sel.universe].name);};
$('tFlip').onclick=()=>{flipped=!flipped;if(view3d&&!busy)moveCam(topPos(),topLook(),.8);render2D();};
$('tUndo').onclick=()=>{if(!canHumanMove()&&!(session&&session.type==='local'&&gameActive&&!busy))return;const vsAI=!!session.ai;let n=vsAI?2:1;n=Math.min(n,fenList.length-1);
 if(vsAI&&game.turn()===session.ai.color)n=1;if(n<=0)return;fenList.splice(-n);sanList.splice(-n);session.uci.splice(-n);shuffles=shuffles.filter(s=>s<=sanList.length);game.load(fenList.at(-1));lastMove=null;clearSel();rebuild();SFX.click();};
$('tResign').onclick=()=>{if(session&&session.type==='online'){olResignAsk();return;}if(!gameActive||busy)return;const w=session.ai?session.ai.color:other(game.turn());endGame(w,'resignation');};
// ================= main loop =================
const clk=new THREE.Clock();let orbit=0;
function loop(){requestAnimationFrame(loop);window.__frames=(window.__frames||0)+1;const rdt=(DEBUG&&window.__fixedDT)||Math.min(clk.getDelta(),.05),dt=rdt*spd,T=clk.elapsedTime;
 for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];tw.t+=dt/tw.dur;tw.fn(Math.min(tw.t,1));if(tw.t>=1){tweens.splice(i,1);tw.res();}}
 for(const p of [...Object.values(pieces),...lineup]){const u=p.userData,b=u.body,P=u.parts;
  if(u.anim!=='dead'){const fl=.75+.25*Math.sin(T*7+u.phase);u.face.eyes.forEach(e=>e.scale.setScalar(fl));}
  if(u.anim)continue;
  if(P.cape)P.cape.rotation.x=.04+Math.sin(T*1.6+u.phase)*.04;
  if(u.state==='selected'){b.position.y=.1+Math.sin(T*5)*.04;b.rotation.set(0,Math.sin(T*2)*.15,0);if(P.armR)P.armR.rotation.x=-1.1+Math.sin(T*5)*.1;}
  else if(u.state==='cheer'){b.position.y=Math.abs(Math.sin(T*5+u.phase))*.18;b.rotation.set(0,0,0);if(P.armR){P.armR.rotation.x=-2.6+Math.sin(T*10+u.phase)*.25;}}
  else{const br=Math.sin(T*2+u.phase);b.scale.set(1,1+br*.012,1);b.position.y=0;b.rotation.set(0,0,0);if(P.armR&&u.type!=='r')P.armR.rotation.x=(u.type==='n'?-.45:-.45)+br*.03;if(P.head)P.head.rotation.y=Math.sin(T*.5+u.phase*3)*.15;}}
 updParticles(dt);updAmbient(T,rdt);
 if(clock&&gameActive&&!busy&&!menuOpen&&session.type!=='replay'&&session.type!=='online'){const c=game.turn();clock[c]-=rdt;const el=$(c==='w'?'ckW':'ckB');el.textContent=fmt(clock[c]);el.classList.toggle('low',clock[c]<30);
  if(clock[c]<=0){clock[c]=0;endGame(other(c),'timeout');}}
 if(menuOpen&&!window.__freezeCam){orbit+=rdt*.07;const k=camK();camera.position.set(Math.sin(orbit)*12.5*k,6.8*k,Math.cos(orbit)*12.5*k);camLook.set(0,-.3,0);}
 if(camFollow&&camFollow.pan){const k=1-Math.exp(-5*dt);camLook.lerp(camFollow.obj.position.clone().setY(.6),k);const d=camera.position.distanceTo(camFollow.obj.position);if(d>3.6)camera.position.lerp(camFollow.obj.position.clone().setY(camera.position.y),k*.25);}
 else if(camFollow){const o=camFollow.obj.position;const tp=o.clone().add(camFollow.off);tp.y=Math.max(tp.y,.3);const k=1-Math.exp(-7*dt);camera.position.lerp(tp,k);camLook.lerp(o.clone().add(camFollow.look),k);}
 controls.enabled=!!session&&!menuOpen&&!cineActive&&!busy&&view3d&&!window.__freezeCam;
 if(controls.enabled)controls.update();else camera.lookAt(camLook);
 let sx=0,sy=0;if(shakeAmp>.002){sx=(Math.random()-.5)*shakeAmp;sy=(Math.random()-.5)*shakeAmp;camera.position.x+=sx;camera.position.y+=sy;shakeAmp*=Math.pow(.004,rdt);}else shakeAmp=0;
 renderer.render(scene,camera);camera.position.x-=sx;camera.position.y-=sy;}
if(DEBUG)window.__dbg={renderer,scene,key,torches};
function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);const U=UNIVERSES[S.sel.universe];if(U)scene.fog.density=U.fogD/Math.max(1,camK()*.8);
 if(session&&!menuOpen&&!busy&&!window.__freezeCam){camera.position.copy(topPos());camLook.copy(topLook());}render2D();}
// ================= debug hooks (used by automated screenshots) =================
if(DEBUG)window.__lineup=c=>{lineup.forEach(p=>scene.remove(p));lineup=[];Object.values(pieces).forEach(p=>p.visible=false);
 if(!c){Object.values(pieces).forEach(p=>p.visible=true);window.__freezeCam=false;return;}['p','n','b','r','q','k'].forEach((t,i)=>{const p=makePiece(t,c);p.position.set((i-2.5)*.98,0,.5);p.rotation.y=.4;scene.add(p);lineup.push(p);});
 window.__freezeCam=true;camera.position.set(0,2.0,5.6);camLook.set(0,.55,.5);};
if(DEBUG)window.__ol=OL;
if(DEBUG)window.__app={game,doMove,startGame,startPuzzle,startLesson,startReplay,showCollection,showQuests,showMenu,openChest,S,setUniverse:k=>{S.sel.universe=k;applyUniverse();},
 bots:BOTS,worker:()=>!!worker,aiRequest,showAI,showLadder,say:(id,e)=>say(id,e),
 simGame:async(w,b,scale=.3,maxPly=200)=>{const g=new Chess();const h=[];while(!g.isGameOver()&&h.length<maxPly){const r=await aiRequest(g.fen(),g.turn()==='w'?w:b,h,scale);g.move({from:r.from,to:r.to,promotion:r.promotion});h.push(r.move);}
  let m=0;g.board().flat().filter(Boolean).forEach(p=>m+=(p.color==='w'?1:-1)*({p:1,n:3,b:3,r:5,q:9,k:0})[p.type]);return {result:g.isCheckmate()?(g.turn()==='w'?'0-1':'1-0'):'no mate',plies:h.length,materialWhite:m};},
 sqScreen:sq=>{const {x,z}=sqToXZ(sq);const v=new THREE.Vector3(x,0,z).project(camera);return {x:(v.x+1)/2*innerWidth,y:(1-v.y)/2*innerHeight};},mobile:MOBILE,
 cam:(x,y,z)=>{window.__freezeCam=true;camera.position.set(x,y,z);camLook.set(0,0,0);},toggleView:()=>$('tView').click(),state:()=>({busy,gameActive,session:session&&session.type})};

ensureQuests();makePortraits();applyUniverse();applyQuality();showMenu();loop();window.__ready=true;
